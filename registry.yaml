# Awesome Claude Code Skills Registry
# Subscribe: add this URL to your skill-registry subscriptions
# https://raw.githubusercontent.com/gavinyao/awesome-skills/main/registry.yaml

skills:
  # ── Self-built (gavinyao) ──────────────────────────────────────────
  - name: skill-registry
    description: 管理和安装 Claude Code skills 的工具，支持订阅、本地注册表、远程安装
    source:
      type: git
      url: https://git.woa.com/qq-devops/agent-skills.git
      path: skill-registry
    category: self-built
    tags: [registry, management, subscription]

  - name: qywx-msg-sender
    description: 企业微信群机器人消息推送，支持文本、Markdown、图片、文件
    source:
      type: git
      url: https://github.com/gavinyao/qywx-msg-sender.git
    category: self-built
    tags: [messaging, wecom, webhook]

  - name: longbridge-trader
    description: 长桥交易助手 — 实时行情、K 线、盘口查询，订单管理，账户持仓
    source:
      type: clawhub
      slug: gavinyao/longbridge-trader
    category: self-built
    tags: [trading, stock, finance]

  # ── Official & Core ────────────────────────────────────────────────
  - name: skill-creator
    description: Create, modify, improve, and benchmark Claude Code skills
    source:
      type: npx
      package: "@anthropic-ai/skill-creator@latest"
    category: official
    tags: [skill, create, eval]
    installs: 225000

  - name: find-skills
    description: Discover and install agent skills from the ecosystem
    source:
      type: npx
      package: "@anthropic-ai/find-skills@latest"
    category: official
    tags: [skill, discovery, search]

  - name: agent-browser
    description: Browser automation CLI for AI agents — navigate, click, fill forms, screenshot
    source:
      type: npx
      package: "@anthropic-ai/agent-browser@latest"
    category: official
    tags: [browser, automation, testing]
    installs: 111000

  - name: webapp-testing
